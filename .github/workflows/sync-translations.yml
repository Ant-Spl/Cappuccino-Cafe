name: Sync translations

on:
  push:
    branches: ["main"]
    paths:
      - "langs/Cafe_en.xml"

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: npm ci

      - name: Sync translations
        run: npm run sync --silent

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          branch: sync/all
          title: Sync translations
          commit-message: Sync translations
          body: |
            This PR was generated automatically by the sync translations workflow.

            Translation files were synced from Cafe_en.xml.
          add-paths: |
            langs/
